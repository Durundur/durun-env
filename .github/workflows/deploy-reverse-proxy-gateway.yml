name: Deploy Reverse Proxy Gateway

on:
    push:
        branches: [main]
        paths:
            - "reverse-proxy-gateway/**"
            - ".github/workflows/deploy-reverse-proxy-gateway.yml"

env:
    REVERSE_PROXY_SERVER_HOST: ${{ secrets.REVERSE_PROXY_SERVER_HOST }}
    REVERSE_PROXY_SERVER_HOST_PORT: ${{ secrets.REVERSE_PROXY_SERVER_HOST_PORT }}
    REVERSE_PROXY_SERVER_USER: ${{ secrets.REVERSE_PROXY_SERVER_USER }}
    REVERSE_PROXY_SERVER_PASSWORD: ${{ secrets.REVERSE_PROXY_SERVER_PASSWORD }}

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repo
              uses: actions/checkout@v4

            - name: Copy config files
              uses: appleboy/scp-action@master
              with:
                  host: ${{ env.REVERSE_PROXY_SERVER_HOST }}
                  port: ${{ env.REVERSE_PROXY_SERVER_HOST_PORT }}
                  username: ${{ env.REVERSE_PROXY_SERVER_USER }}
                  password: ${{ env.REVERSE_PROXY_SERVER_PASSWORD }}
                  source: "reverse-proxy-gateway/nginx"
                  target: "~/gateway-tmp"
                  strip_components: 1

            - name: Deploy configs and restart services
              uses: appleboy/ssh-action@master
              with:
                  host: ${{ env.REVERSE_PROXY_SERVER_HOST }}
                  port: ${{ env.REVERSE_PROXY_SERVER_HOST_PORT }}
                  username: ${{ env.REVERSE_PROXY_SERVER_USER }}
                  password: ${{ env.REVERSE_PROXY_SERVER_PASSWORD }}
                  envs: REVERSE_PROXY_SERVER_PASSWORD
                  script_stop: true
                  script: |
                      sudo -S cp ~/gateway-tmp/nginx/nginx.conf /etc/nginx/nginx.conf <<< "$REVERSE_PROXY_SERVER_PASSWORD"
                      sudo -S cp -r ~/gateway-tmp/nginx/sites-available/* /etc/nginx/http.d/ <<< "$REVERSE_PROXY_SERVER_PASSWORD"

                      rm -rf ~/gateway-tmp

                      sudo -S nginx -t <<< "$REVERSE_PROXY_SERVER_PASSWORD" && sudo -S nginx -s reload <<< "$REVERSE_PROXY_SERVER_PASSWORD"
