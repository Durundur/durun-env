server {
    listen 80;
    listen [::]:80;

    server_name monitor.durundur.online;

    access_log /var/log/nginx/monitor.durundur.online_access.log main;
    error_log  /var/log/nginx/monitor.durundur.online_error.log warn;

    location / {
        proxy_pass http://oracle2.internal:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
