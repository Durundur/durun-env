server {
    listen 80;
    listen [::]:80;

    server_name buysellnow.durundur.online;

    access_log /var/log/nginx/buysellnow.durundur.online_access.log main;
    error_log  /var/log/nginx/buysellnow.durundur.online_error.log warn;

    location /socket.io/ {
        proxy_pass http://oracle1.internal:51886;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_http_version 1.1;
    }

    location /api {
        proxy_pass http://oracle1.internal:51886;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://oracle1.internal:51887;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
